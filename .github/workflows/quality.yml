name: Quality Engineering
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run qa:generate:check
      - name: Install browser dependencies
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build + cross-browser smoke
        run: npm run qa:smoke
      - name: Risk gate (accessibility, security, PWA, resilience)
        run: npm run qa:browsers -- --project showcase-android --grep '@a11y|@security|@pwa|@resilience'
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: quality-gate-failure
          path: |
            playwright-report/
            test-results/showcase/
          retention-days: 7
          if-no-files-found: ignore
  full-regression:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install browser dependencies
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run qa:showcase
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: full-regression-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
  visual:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - run: npm run qa:visual
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: visual-failure
          path: |
            playwright-report/showcase/
            test-results/showcase/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy production (FTPS)
    needs: [quality-gate, full-regression, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://jednakula.progtest.pl
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build tested commit
        run: npm run build
      - name: Upload through verified FTPS
        env:
          CAL_FTP_PASSWORD: ${{ secrets.CAL_FTP_PASSWORD }}
        run: python3 scripts/cal-ftp.py upload
      - name: Verify static files and SPA routes over HTTPS
        run: python3 scripts/cal-ftp.py verify
      - name: Preserve previous production files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.sha }}-${{ github.run_attempt }}
          path: release/backup-cal-*/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
